<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard · Interaction fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <nav aria-label="Main"><a href="/">Home</a></nav>
  </header>
  <main>
    <h1>Keyboard</h1>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <form role="search" id="search-form">
      <label for="search">Search</label>
      <input type="search" id="search" name="q">
    </form>
    <form id="pin-form">
      <label for="pin">PIN</label>
      <input type="password" id="pin" inputmode="numeric" autocomplete="off">
    </form>
    <p>Press <kbd>?</kbd> to show keyboard shortcuts.</p>
    <dialog id="shortcuts" aria-labelledby="shortcuts-title">
      <h2 id="shortcuts-title">Shortcuts</h2>
      <p><kbd>?</kbd> shows this list. <kbd>Esc</kbd> closes it.</p>
      <button type="button" id="close-shortcuts">Close</button>
    </dialog>
    <script src="/keys.js"></script>
  </main>
</body>
</html>
