<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabs · Interaction fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <nav aria-label="Main"><a href="/">Home</a></nav>
  </header>
  <main>
    <h1>Tabs</h1>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p><a href="/help" target="_blank">Open help</a></p>
    <p><button type="button" id="open-popup">Open popup</button></p>
    <script>
      document.getElementById('open-popup').addEventListener('click', () => { window.open('/popup', 'popup'); });
      window.addEventListener('message', (event) => {
        if (event.origin === location.origin && event.data === 'hello') document.getElementById('status').textContent = 'Popup said hello';
      });
    </script>
  </main>
</body>
</html>
