  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">

<body data-page="invoice">

    <nav aria-label="Main">
      <a href="/invoices">Invoices</a>
      <a href="/reports">Reports</a>
    </nav>
  </header>
  <main>
    <h1 id="invoice-title">Invoice</h1>
    <dl class="invoice-meta">
      <dt>Customer</dt><dd id="invoice-customer"></dd>
      <dt>Amount</dt><dd id="invoice-amount"></dd>
      <dt>Status</dt><dd id="invoice-status"></dd>

    <button type="button" id="mark-paid" class="primary">Mark as paid</button>
    <p><a href="/invoices">Back to invoices</a></p>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
