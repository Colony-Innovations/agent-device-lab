<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; background: #f6f7f9; color: #1c1e21; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    form { display: flex; gap: 8px; }
    input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; border: 1px solid #b8bec7; border-radius: 6px; }
    button { padding: 10px 14px; font: inherit; border: 0; border-radius: 6px; background: #2855c7; color: #fff; cursor: pointer; }
    button.secondary { background: #e3e7ee; color: #1c1e21; }
    ul { list-style: none; margin: 16px 0; padding: 0; }
    li { padding: 10px 12px; margin-bottom: 6px; background: #fff; border: 1px solid #dde1e7; border-radius: 6px; overflow-wrap: anywhere; }
    [role="status"] { min-height: 1.4em; color: #495260; }
  </style>
</head>
<body>
  <main>
    <h1>Tasks</h1>
    <form id="add-form">
      <label for="title" hidden>Task title</label>
      <input id="title" name="title" aria-label="Task title" placeholder="Task title" autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="tasks"></ul>
    <button type="button" id="refresh" class="secondary">Refresh</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const list = document.getElementById('tasks');
    const status = document.getElementById('status');
    const input = document.getElementById('title');

    function render(tasks) {
      list.replaceChildren(...tasks.map((task) => {
        const li = document.createElement('li');
        li.textContent = `${task.title} — ${task.status}`;
        return li;
      }));
    }

    async function refresh() {
      const res = await fetch('/api/tasks');
      if (!res.ok) { status.textContent = `Could not load tasks (${res.status})`; return; }
      const tasks = await res.json();
      render(tasks);
      const done = tasks.filter((t) => t.status === 'done').length;
      status.textContent = `${tasks.length} ${tasks.length === 1 ? 'task' : 'tasks'}, ${done} done`;
    }

    document.getElementById('add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) { status.textContent = `Could not add task (${res.status})`; return; }
      input.value = '';
      const listRes = await fetch('/api/tasks');
      if (listRes.ok) render(await listRes.json());
      status.textContent = `Added "${title}"`;
    });
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
